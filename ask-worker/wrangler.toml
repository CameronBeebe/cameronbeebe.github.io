name = "cameron-portfolio-ask"
main = "worker.mjs"
compatibility_date = "2026-11-10"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[ratelimits]]
name = "ASK_LIMIT"
namespace_id = "74101"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "PALETTE_LIMIT"
namespace_id = "74102"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "ASCII_LIMIT"
namespace_id = "74103"
simple = { limit = 3, period = 60 }
